[project]
name = "recoverai-backend"
version = "1.0.0"
description = "RecoverAI Autonomous Revenue Recovery Platform Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.3",
    "alembic>=1.13.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "email-validator>=2.0.0",
    "razorpay>=1.4.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pyright]
venvPath = "backend"
venv = ".venv"
extraPaths = ["backend", "backend/app"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
